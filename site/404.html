<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting — 99.95squad</title>
</head>
<body>
  <p>Redirecting to 99.95squad…</p>
  <script>
    /* GitHub Pages serves this file for direct/path refreshes. Convert the
     * requested path to the app's hash route while preserving the repository
     * base (/99.95squad/) and query string. No server rewrite is available. */
    (function () {
      var parts = location.pathname.split("/").filter(Boolean);
      var onPages = /\.github\.io$/i.test(location.hostname);
      var base = onPages && parts.length ? "/" + parts.shift() + "/" : "/";
      var route = parts.join("/");
      var hash = route ? "#/" + route + location.search : "#/";
      location.replace(location.origin + base + hash);
    })();
  </script>
</body>
</html>
