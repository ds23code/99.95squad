<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}QuestionBank{% endblock %} · 99.95 Squad</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="{{ url_for('index') }}">📚 QuestionBank</a>
    <nav>
      <a href="{{ url_for('index') }}" class="{{ 'active' if active == 'search' }}">Search</a>
      <a href="{{ url_for('browse') }}" class="{{ 'active' if active == 'browse' }}">Browse</a>
      <a href="{{ url_for('practice') }}" class="{{ 'active' if active == 'practice' }}">Practice</a>
    </nav>
  </div>
</header>
<main class="wrap">
  {% block content %}{% endblock %}
</main>
<footer class="wrap footer">
  <p>Rendered question images are the canonical source. OCR text is search-only.
     Built for Australian Year 11–12 students. </p>
</footer>
<script src="{{ url_for('static', filename='app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
