# =============================================================================
# Subjects & courses
# =============================================================================
# `aliases` are matched (case-insensitively, as substrings) against paper
# filenames and paper text to auto-detect the course.  Add your own.
#
# Add new subjects/courses here; the pipeline and website pick them up
# automatically (run `python -m pipeline init` after editing to seed the DB).

default_year_level: 12

subjects:
  - id: mathematics
    name: Mathematics
    aliases: [maths, mathematics, math]
    courses:
      - id: mathematics-advanced
        name: Mathematics Advanced
        aliases: [2u, 2 unit, 2unit, adv, advanced, mathematics advanced, mathadv, "2u-adv"]
        year_level: 12
      - id: mathematics-extension-1
        name: Mathematics Extension 1
        aliases: [3u, 3 unit, 3unit, ext1, extension 1, ext 1, mx1, mathematics extension 1]
        year_level: 12
      - id: mathematics-extension-2
        name: Mathematics Extension 2
        aliases: [4u, 4 unit, 4unit, ext2, extension 2, ext 2, mx2, mathematics extension 2]
        year_level: 12
      - id: mathematics-standard
        name: Mathematics Standard
        aliases: [std, standard, 1u, general, mathematics standard, mathstd]
        year_level: 12

