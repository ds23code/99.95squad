# =============================================================================
# Topic taxonomy (per course)
# =============================================================================
# Edit freely: add topics/subtopics and keywords.  Keywords are matched as
# case-insensitive substrings against OCR / embedded text, so they can be
# stem-ish fragments ("differentiat" matches "differentiate", "differentiation").
# Empty keyword lists mean classification for that topic relies on subtopics only.
#
# After editing: python -m pipeline init   (re-seeds the taxonomy tables)

